<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Resi Pending</title>
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Library Kamera Baru: Html5-Qrcode (Jauh Lebih Stabil di Android) -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">

    <div class="max-w-md mx-auto p-4 space-y-6">
        <!-- Header -->
        <div class="text-center py-4 bg-gray-800 rounded-2xl shadow-xl border border-gray-700">
            <h1 class="text-2xl font-bold text-emerald-400"><i class="fa-solid fa-barcode mr-2"></i>Scan Resi Pending</h1>
            <p class="text-xs text-gray-400 mt-1">Aplikasi Pencatatan Realtime Cloud</p>
        </div>

        <!-- Area Kamera -->
        <div class="relative bg-gray-800 rounded-2xl overflow-hidden shadow-xl border border-gray-700 aspect-video flex flex-col items-center justify-center">
            <!-- Elemen Scanner dari Library Baru -->
            <div id="reader" class="w-full h-full object-cover hidden"></div>
            
            <!-- Placeholder Sebelum Kamera Aktif -->
            <div id="placeholder" class="text-center p-6">
                <i class="fa-solid fa-camera text-5xl text-gray-600 mb-3 animate-pulse"></i>
                <p class="text-sm text-gray-400">Kamera belum aktif. Klik tombol di bawah untuk mulai.</p>
            </div>
        </div>

        <!-- Tombol Kontrol Kamera -->
        <div class="grid grid-cols-2 gap-3">
            <button id="btn-start" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-emerald-900/30">
                <i class="fa-solid fa-play"></i> Mulai Scan
            </button>
            <button id="btn-stop" class="w-full bg-gray-700 hover:bg-gray-600 text-gray-300 font-semibold py-3 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 border border-gray-600" disabled>
                <i class="fa-solid fa-stop"></i> Berhenti
            </button>
        </div>

        <!-- Statistik Kontainer -->
        <div class="grid grid-cols-2 gap-4 bg-gray-800 p-4 rounded-2xl border border-gray-700 shadow-xl">
            <div class="text-center border-r border-gray-700">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Sesi Ini (Belum Di-export)</span>
                <div id="total-sesi" class="text-3xl font-bold text-emerald-400 mt-1">0</div>
            </div>
            <div class="text-center">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Status Kamera</span>
                <div id="status-kamera" class="text-sm font-semibold text-red-400 mt-2 flex items-center justify-center gap-1.5">
                    <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span> Mati
                </div>
            </div>
        </div>

        <!-- Tombol Ekspor Excel -->
        <button id="btn-export" class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-xl shadow-teal-900/20">
            <i class="fa-solid fa-file-excel text-lg"></i> Export ke Excel & Reset Tampilan
        </button>

        <!-- Daftar Resi Ter-scan -->
        <div class="bg-gray-800 rounded-2xl p-4 border border-gray-700 shadow-xl space-y-3">
            <div class="flex justify-between items-center border-b border-gray-700 pb-2">
                <h3 class="font-semibold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-emerald-400"></i> List Resi Sesi Ini
                </h3>
            </div>
            <div id="list-resi" class="max-h-60 overflow-y-auto space-y-2 text-sm pr-1">
                <p id="empty-state" class="text-center text-gray-500 py-6 italic">Belum ada resi yang di-scan pada sesi ini.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // Konfigurasi asli dari proyek Firebase Anda
        const firebaseConfig = {
          apiKey: "AIzaSyDIYwfI_mnZDcsLJQQMLKQoX-XkMY-dP08",
          authDomain: "scan-resi-app.firebaseapp.com",
          projectId: "scan-resi-app",
          storageBucket: "scan-resi-app.firebasestorage.app",
          messagingSenderId: "435869269413",
          appId: "1:435869269413:web:fb0934a7dabed3c5237c4c",
          measurementId: "G-VK4XFP40KE"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // DOM Elements
        const readerDiv = document.getElementById('reader');
        const placeholder = document.getElementById('placeholder');
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnExport = document.getElementById('btn-export');
        const statusKamera = document.getElementById('status-kamera');
        const totalSesiElement = document.getElementById('total-sesi');
        const listResiContainer = document.getElementById('list-resi');
        const emptyState = document.getElementById('empty-state');

        // State Variabel
        let dataSesiLokal = [];
        let html5QrcodeScanner = null;

        // Fungsi Memulai Kamera Belakang secara Instan
        function startScanning() {
            placeholder.classList.add('hidden');
            readerDiv.classList.remove('hidden');
            btnStart.disabled = true;
            btnStop.disabled = false;

            statusKamera.innerHTML = `<span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span> Aktif`;
            statusKamera.className = "text-sm font-semibold text-emerald-400 mt-2 flex items-center justify-center gap-1.5";

            // Membuat instance pembaca barcode baru
            html5QrcodeScanner = new Html5Qrcode("reader");

            // Menjalankan langsung kamera belakang (environment)
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                {
                    fps: 15,    // Kecepatan scan per detik
                    qrbox: (width, height) => {
                        return { width: width * 0.8, height: height * 0.6 } // Kotak fokus bidik barcode
                    }
                },
                (decodedText) => {
                    // JIKA BERHASIL TER-SCAN:
                    stopScanning(); // Langsung matikan kamera agar tidak scan 2x
                    handleBarcodeScanned(decodedText); // Kirim data ke Firebase
                },
                (errorMessage) => {
                    // Abaikan eror pencarian saat kamera sedang membidik frame
                }
            ).catch((err) => {
                console.error("Gagal akses kamera:", err);
                alert("Gagal membuka kamera. Pastikan izin kamera di browser sudah diberikan.");
                stopScanning();
            });
        }

        // Fungsi Mematikan Kamera
        function stopScanning() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    html5QrcodeScanner = null;
                    resetUI();
                }).catch((err) => {
                    html5QrcodeScanner = null;
                    resetUI();
                });
            } else {
                resetUI();
            }
        }

        function resetUI() {
            readerDiv.classList.add('hidden');
            placeholder.classList.remove('hidden');
            btnStart.disabled = false;
            btnStop.disabled = true;
            statusKamera.innerHTML = `<span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span> Mati`;
            statusKamera.className = "text-sm font-semibold text-red-400 mt-2 flex items-center justify-center gap-1.5";
        }

        // Logika Pengiriman Data ke Firebase
        async function handleBarcodeScanned(nomorResi) {
            const resiBersih = nomorResi.trim();
            if (!resiBersih) return;

            if (navigator.vibrate) navigator.vibrate(150); // Getar HP

            // 1. Simpan Cloud Firestore
            try {
                await addDoc(collection(db, "pending_resi"), {
                    no_resi: resiBersih,
                    timestamp: serverTimestamp(),
                    device: navigator.userAgent
                });
            } catch (error) {
                console.error("Firebase Error:", error);
                alert("Gagal simpan ke Firebase: " + error.message);
            }

            // 2. Simpan Sesi Lokal & Update UI Tampilan
            const waktuSekarang = new Date().toLocaleString('id-ID');
            dataSesiLokal.unshift({ 'No Resi': resiBersih, 'Waktu Scan': waktuSekarang });

            const checkEmpty = document.getElementById('empty-state');
            if (checkEmpty) checkEmpty.remove();

            const rowHTML = `
                <div class="flex justify-between items-center bg-gray-700/50 border border-gray-700 p-2.5 rounded-xl animate-fadeIn">
                    <span class="font-mono font-medium text-emerald-300 break-all">${resiBersih}</span>
                    <span class="text-xs text-gray-400 shrink-0 ml-2">${new Date().toLocaleTimeString('id-ID')}</span>
                </div>
            `;
            listResiContainer.insertAdjacentHTML('afterbegin', rowHTML);
            totalSesiElement.textContent = dataSesiLokal.length;

            // 3. Notifikasi Pop-up Sukses
            alert(`✅ RESI BERHASIL DI-SCAN!\n\nNomor: ${resiBersih}\n\nKamera otomatis berhenti agar tidak ganda. Klik 'Mulai Scan' lagi untuk paket selanjutnya.`);
        }

        // Logika Excel & Reset Hitungan Sesi ke 0
        function exportToExcelAndReset() {
            if (dataSesiLokal.length === 0) {
                alert("Belum ada data resi pada sesi ini untuk di-export!");
                return;
            }

            const worksheet = XLSX.utils.json_to_sheet(dataSesiLokal);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Resi Pending");

            const tanggal = new Date().toISOString().slice(0,10);
            XLSX.writeFile(workbook, `Rekap_Resi_Pending_${tanggal}.xlsx`);

            // RESET TOTAL COUNTER SCREEN
            dataSesiLokal = []; 
            totalSesiElement.textContent = "0"; 
            listResiContainer.innerHTML = `<p id="empty-state" class="text-center text-gray-500 py-6 italic">Belum ada resi yang di-scan pada sesi ini.</p>`; 
            
            alert("📊 File Excel berhasil di-download!\n\nHitungan total resi di layar telah ter-reset kembali ke nol. Data Anda tetap tersimpan utuh di Firebase Cloud.");
        }

        // Event Listener Tombol
        btnStart.addEventListener('click', startScanning);
        btnStop.addEventListener('click', stopScanning);
        btnExport.addEventListener('click', exportToExcelAndReset);
    </script>

    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        /* Memperbaiki tampilan box video library baru agar pas di kontainer */
        #reader video { object-cover: cover !important; width: 100% !important; height: 100% !important; }
    </style>
</body>
</html>
