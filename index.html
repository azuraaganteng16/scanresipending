<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pending Resi</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <div class="max-w-4xl mx-auto p-4 md:p-6">
        
        <header class="flex flex-col sm:flex-row justify-between items-center bg-white p-6 rounded-2xl shadow-sm border border-slate-100 mb-6 gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-500 text-white p-3 rounded-xl shadow-md shadow-blue-200">
                    <i class="fa-solid fa-boxes-stacked text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Data Pending Resi</h1>
                    <p class="text-xs text-slate-400">Sinkronisasi Otomatis Firebase Cloud</p>
                </div>
            </div>
            <div class="bg-slate-100 px-4 py-2 rounded-xl text-center min-w-[120px]">
                <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Resi</span>
                <span id="totalResi" class="text-2xl font-bold text-slate-700">0</span>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="md:col-span-1 flex flex-col gap-4">
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                    <h3 class="font-bold text-sm text-slate-400 uppercase tracking-wider mb-4">Kontrol Panel</h3>
                    
                    <button id="btnToggleScan" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-100 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer mb-3">
                        <i class="fa-solid fa-camera"></i> <span>Mulai Scan</span>
                    </button>
                    
                    <button onclick="exportToExcel()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-emerald-100 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-file-excel"></i> <span>Export Excel</span>
                    </button>
                </div>

                <div id="scannerContainer" class="hidden bg-white p-4 rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                    <div id="reader" class="rounded-xl overflow-hidden bg-slate-900"></div>
                </div>
            </div>

            <div class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                    <h3 class="font-bold text-sm text-slate-500 uppercase tracking-wider">Daftar Scan Resi</h3>
                    <span class="flex items-center gap-1.5 text-xs text-emerald-600 font-medium bg-emerald-50 px-2.5 py-1 rounded-full">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Firebase Live
                    </span>
                </div>
                
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-400 text-xs font-semibold uppercase tracking-wider border-b border-slate-100">
                                <th class="py-3 px-5 w-16">No</th>
                                <th class="py-3 px-5">Nomor Resi</th>
                                <th class="py-3 px-5">Waktu Scan</th>
                            </tr>
                        </thead>
                        <tbody id="tabelResi" class="divide-y divide-slate-100 text-sm">
                            </tbody>
                    </table>
                    
                    <div id="emptyState" class="p-12 text-center text-slate-400">
                        <i class="fa-regular fa-folder-open text-4xl mb-3 block text-slate-300"></i>
                        Belum ada data resi. Silakan scan sekarang.
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        // Import Firebase SDK versi terbaru (v10+)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Menggunakan data konfigurasi asli dari screenshot Anda
        const firebaseConfig = {
  apiKey: "AIzaSyDIYwfI_mnZDcsLJQQMLKQoX-XkMY-dP08",
  authDomain: "scan-resi-app.firebaseapp.com",
  projectId: "scan-resi-app",
  storageBucket: "scan-resi-app.firebasestorage.app",
  messagingSenderId: "435869269413",
  appId: "1:435869269413:web:fb0934a7dabed3c5237c4c",
  measurementId: "G-VK4XFP40KE"
};

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const resiCollection = collection(db, "pending_resi");

        let html5QrcodeScanner = null;
        let isScanning = false;
        let localDataArray = [];

        const btnToggleScan = document.getElementById('btnToggleScan');
        const scannerContainer = document.getElementById('scannerContainer');

        // 1. Ambil Data Realtime dari Firebase Firestore
        const q = query(resiCollection, orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const tbody = document.getElementById('tabelResi');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';
            localDataArray = [];
            
            let count = 1;
            snapshot.forEach((doc) => {
                const data = doc.data();
                localDataArray.push(data);

                const row = `<tr class="hover:bg-slate-50 transition-colors">
                    <td class="py-3 px-5 font-medium text-slate-400">${count}</td>
                    <td class="py-3 px-5 font-semibold text-slate-700 tracking-wide">${data.resi}</td>
                    <td class="py-3 px-5 text-slate-400 text-xs">${data.waktu}</td>
                </tr>`;
                tbody.innerHTML += row;
                count++;
            });

            document.getElementById('totalResi').textContent = snapshot.size;
            
            if (snapshot.size > 0) {
                emptyState.classList.add('hidden');
            } else {
                emptyState.classList.remove('hidden');
            }
        });

        // 2. Logic Tombol Kamera Scan
        btnToggleScan.addEventListener('click', () => {
            if (!isScanning) {
                scannerContainer.classList.remove('hidden');
                btnToggleScan.innerHTML = `<i class="fa-solid fa-stop"></i> <span>Hentikan</span>`;
                btnToggleScan.className = "w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-rose-100 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer mb-3";
                startScanner();
                isScanning = true;
            } else {
                stopScanner();
            }
        });

        function startScanner() {
            html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start(
                { facingMode: "environment" }, 
                { fps: 12, qrbox: { width: 260, height: 160 } },
                onScanSuccess
            ).catch(err => {
                alert("Kamera gagal diakses: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    scannerContainer.classList.add('hidden');
                    btnToggleScan.innerHTML = `<i class="fa-solid fa-camera"></i> <span>Mulai Scan</span>`;
                    btnToggleScan.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-blue-100 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer mb-3";
                    isScanning = false;
                }).catch(err => console.error(err));
            }
        }

        // 3. Simpan Ke Firebase Ketika Scan Sukses
        async function onScanSuccess(decodedText) {
            const sudahAda = localDataArray.some(item => item.resi === decodedText);
            if (sudahAda) return; 

            const sekarang = new Date();
            const opsi = { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const waktuStr = sekarang.toLocaleString('id-ID', opsi).replace(/,/g, '');

            try {
                await addDoc(resiCollection, {
                    resi: decodedText,
                    waktu: waktuStr,
                    timestamp: sekarang.getTime()
                });
                
                if (navigator.vibrate) navigator.vibrate(100);
                
            } catch (error) {
                console.error("Gagal simpan ke Firebase: ", error);
                alert("Gagal sinkronisasi database cloud.");
            }
        }

        // 4. Fungsi Export ke Excel Global
        window.exportToExcel = function() {
            if (localDataArray.length === 0) {
                alert("Data kosong! Tidak ada yang bisa di-export.");
                return;
            }

            const dataTerurut = [...localDataArray].reverse();

            const dataExcel = dataTerurut.map((item, index) => ({
                "No": index + 1,
                "Nomor Resi / Barcode": item.resi,
                "Waktu Scan": item.waktu
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataExcel);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Pending Resi");

            const tgl = new Date().toISOString().slice(0,10);
            XLSX.writeFile(workbook, `Rekap_Pending_Resi_${tgl}.xlsx`);
        }
    </script>
</body>
</html>
